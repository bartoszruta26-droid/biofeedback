name: serial-write-policy

on:
  push:
    branches:
      - integration/all-work
  pull_request:
    branches:
      - integration/all-work

jobs:
  serial-write-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check complete serial write handling
        run: python3 tests/serial_write_policy_regression.py
