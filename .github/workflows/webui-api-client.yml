name: WebUI API client

on:
  push:
    branches:
      - integration/all-work
      - main
    paths:
      - "platforms/webui/**"
      - ".github/workflows/webui-api-client.yml"
  pull_request:
    branches:
      - main
      - integration/all-work
    paths:
      - "platforms/webui/**"
      - ".github/workflows/webui-api-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax checks
        run: |
          node --check platforms/webui/api-client.js
          node --check platforms/webui/app.js
      - name: API client tests
        run: node --test platforms/webui/api-client.test.js
