name: authentication-diagnostics-policy

on:
  push:
    branches:
      - integration/all-work
      - fix/auth-debug-disabled-by-default
  pull_request:
    branches:
      - integration/all-work

permissions:
  contents: read

jobs:
  auth-diagnostics-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify authentication diagnostics are disabled by default
        run: python3 tests/auth_debug_defaults_regression.py
