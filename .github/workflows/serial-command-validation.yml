name: serial-command-validation

on:
  push:
    branches: [main]
    paths:
      - "src/sensor/SerialCommunication.cpp"
      - "tests/serial_command_validation_regression.py"
      - ".github/workflows/serial-command-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/sensor/SerialCommunication.cpp"
      - "tests/serial_command_validation_regression.py"
      - ".github/workflows/serial-command-validation.yml"

jobs:
  serial-command-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check serial command input validation
        run: python3 tests/serial_command_validation_regression.py
