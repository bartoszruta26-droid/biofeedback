name: android-ui-build

on:
  push:
    branches:
      - integration/all-work
    paths:
      - 'platforms/android/**'
      - '.github/workflows/android-ui.yml'
  pull_request:
    branches:
      - integration/all-work
    paths:
      - 'platforms/android/**'
      - '.github/workflows/android-ui.yml'

permissions:
  contents: read

jobs:
  android-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android application
        working-directory: platforms/android
        run: gradle --no-daemon :app:assembleDebug
