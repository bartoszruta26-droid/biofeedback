name: security-regression

on:
  push:
    branches:
      - integration/all-work
      - feature/configurable-file-encryption
  pull_request:
    branches:
      - main
      - integration/all-work

jobs:
  core-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libssl-dev qtbase5-dev pkg-config nlohmann-json3-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build regression targets
        run: cmake --build build --parallel 2 --target login_dialog_compile password_hasher_regression encryption_regression auth_regression data_manager_regression biofeedback_legacy_migrate legacy_xor_migration_regression
      - name: Run regression tests
        run: ctest --test-dir build --output-on-failure
