name: security-regression

on:
  push:
    branches:
      - integration/all-work
      - 'sync/**'
      - feature/configurable-file-encryption
  pull_request:
    branches:
      - main
      - integration/all-work

jobs:
  core-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check serial diagnostics defaults
        run: python3 tests/serial_diagnostics_policy_regression.py
      - name: Check measurement tab lifecycle
        run: python3 tests/measurement_tab_lifecycle_regression.py
      - name: Check patient routing and device timestamp integration
        run: python3 tests/measurement_integration_regression.py
      - name: Check training session clock cadence
        run: python3 tests/training_session_timer_regression.py
      - name: Check single measurement reader
        run: python3 tests/measurement_single_reader_regression.py
      - name: Check game sensor ownership
        run: python3 tests/game_sensor_ownership_regression.py
      - name: Check HX711 calibration protocol
        run: python3 tests/hx711_calibration_protocol_regression.py
      - name: Check complete training history persistence
        run: python3 tests/training_history_regression.py
      - name: Check explicit training session state machine
        run: python3 tests/session_state_machine_regression.py
      - name: Check training checkpoint recovery
        run: python3 tests/training_checkpoint_recovery_regression.py
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libssl-dev qtbase5-dev libqt5charts5-dev libserialport-dev pkg-config nlohmann-json3-dev libncurses-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build regression targets
        run: cmake --build build --parallel 2 --target biofeedback login_dialog_compile password_hasher_regression encryption_regression auth_regression data_manager_regression biofeedback_legacy_migrate legacy_xor_migration_regression biofeedback_tui tui_model_regression biofeedback_api measurement_engine_regression measurement_training_pipeline_regression training_session_clock_regression session_state_machine_regression repetition_detector_regression force_units_regression serial_pty_regression training_history_restart_regression training_tab_process_restart_regression game_engine_regression game_factory_regression calibration_profile_regression protocol_parser_regression biomechanical_parameter_availability_regression
      - name: Smoke-test local HTTP API
        run: |
          ./build/biofeedback_api --port 18765 > /tmp/biofeedback-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:18765/healthz > /tmp/biofeedback-health.json; then break; fi
            sleep 1
          done
          grep -q '"ok":true' /tmp/biofeedback-health.json
          curl --silent --fail http://127.0.0.1:18765/api/v1/status | grep -q '"status":"ready"'
          missing_code=$(curl --silent --output /tmp/biofeedback-404.json --write-out '%{http_code}' http://127.0.0.1:18765/api/v1/unknown)
          test "$missing_code" = "404"
          disabled_code=$(curl --silent --output /tmp/biofeedback-disabled.json --write-out '%{http_code}' -X POST http://127.0.0.1:18765/api/v1/devices/sensor-01/connect)
          test "$disabled_code" = "503"
          grep -q 'CAPABILITY_NOT_AVAILABLE' /tmp/biofeedback-disabled.json
          python3 - <<'PY'
          import socket

          cases = [
              ("duplicate content length",
               b"GET /healthz HTTP/1.1\r\nHost: localhost\r\nContent-Length: 0\r\ncontent-length: 0\r\n\r\n"),
              ("transfer encoding",
               b"POST /api/v1/test HTTP/1.1\r\nHost: localhost\r\nTransfer-Encoding: chunked\r\n\r\n0\r\n\r\n"),
              ("malformed header",
               b"GET /healthz HTTP/1.1\r\nHost localhost\r\n\r\n"),
          ]
          for label, request in cases:
              with socket.create_connection(("127.0.0.1", 18765), timeout=3) as client:
                  client.sendall(request)
                  response = client.recv(4096)
              status = response.split(b"\r\n", 1)[0]
              if b" 400 " not in status:
                  raise SystemExit(f"{label}: expected HTTP 400, got {status!r}")
          print("HTTP parser rejection cases passed")
          PY
      - name: Smoke-test TUI command modes
        run: ./build/biofeedback_tui --version && ./build/biofeedback_tui --status && ./build/biofeedback_tui --list-ports
      - name: Validate WebUI JavaScript
        run: node --check platforms/webui/app.js
      - name: Run regression tests
        run: ctest --test-dir build --output-on-failure
